<rect x="30" y="30" width="700" height="70" fill="#2A1710" stroke="#FF7A38" stroke-width="1.5"/>
<text x="380.0" y="54.875" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="-0.02em" text-anchor="middle" dominant-baseline="central">1. HAI 도구 — 원문은 사내 AI 만 읽는다</text>
